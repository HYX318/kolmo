[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kolmo"
version = "0.1.0"
description = "China market data ingestion, profile generation, and visualization tools."
requires-python = ">=3.9"
readme = "README.md"
dependencies = [
    "akshare>=1.18.0",
    "baostock>=0.8.9",
    "pandas>=2.0.0",
]

[project.scripts]
kolmo-build-cn-profile = "kolmo.ashare.build_cn_profile_daily:main"
kolmo-update-cn-profile = "kolmo.ashare.update_cn_profile_daily:main"
kolmo-fetch-baostock-daily = "kolmo.ashare.fetch_baostock_daily:main"
kolmo-partition-daily = "kolmo.ashare.partition_daily_bars_by_date:main"
kolmo-normalize-daily-profile = "kolmo.ashare.normalize_daily_profile:main"
kolmo-compress-raw-cache = "kolmo.ashare.compress_raw_cache:main"
kolmo-backfill-profile-board = "kolmo.ashare.backfill_profile_board:main"
kolmo-profile-health-check = "kolmo.ashare.profile_health_check:main"
kolmo-fetch-index-daily = "kolmo.index.fetch_baostock_index_daily:main"
kolmo-check-profile-ohlc = "kolmo.validation.profile_ohlc_check:main"
kolmo-fetch-baostock-financials = "kolmo.fundamental.fetch_baostock_financials:main"
kolmo-validate-financials = "kolmo.fundamental.validate_financials:main"
kolmo-update-if-trading-day = "kolmo.scheduler.update_cn_profile_if_trading_day:main"
kolmo-profile-summary = "kolmo.viz.profile_summary:main"
kolmo-symbol-ohlcv = "kolmo.viz.symbol_ohlcv:main"
kolmo-market-terminal = "kolmo.viz.market_terminal:main"
